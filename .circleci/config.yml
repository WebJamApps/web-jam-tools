version: 2.1

# CI quality + security gate for web-jam-tools (web-jam-tools#84, extended #133).
#
# Runs the same checks you can run locally, so "green locally" == "green in CI":
#   deno task check · lint · fmt:check · coverage:check · audit · sast
# (coverage:check runs the unit tests — including the skills/ + sources.yaml
# validation test, web-jam-tools#133 — and fails under 90% all-files line
# coverage)
#   bash -n + shellcheck -S error over every tracked *.sh (scripts/, hooks/)
#   deno.json "version" bump check (PR branches only — diffs against the
#   merge-base with origin/dev; skipped on dev/main)
#
# Uses a `docker` executor (Node 24.18.1 LTS base) with Deno, Trivy, Semgrep, and
# shellcheck installed as binaries — so the whole gate can be reproduced
# locally with `circleci local execute gate` (great for debugging CI). The
# audit/sast scripts auto-detect: they use these binaries here, and fall back
# to Docker images on a dev machine that only has Docker.
#
# `gate` is a REQUIRED status check on `dev` and `main` via GitHub branch
# protection. The `deploy` job (below) deploys the daily-devotional service to
# Deno Deploy from `main` only, after `gate` passes (see that job + the README
# "Deploy" section).

executors:
  ci:
    docker:
      - image: cimg/node:24.18.1

jobs:
  gate:
    executor: ci
    environment:
      # web-jam-tools#275: explicit, cacheable Deno dependency dir. Without
      # this every build re-resolves + re-downloads npm/jsr deps (incl.
      # playwright) from scratch, and a registry blip fails the whole gate
      # as an unattributable "Test failed".
      DENO_DIR: /home/circleci/.cache/deno
    steps:
      - checkout
      - run:
          name: Install Deno + Trivy + Semgrep + shellcheck
          command: |
            # Deno (pinned)
            curl -fsSL https://deno.land/install.sh | sh -s v2.9.4
            echo 'export PATH="$HOME/.deno/bin:$PATH"' >> "$BASH_ENV"
            # Trivy (pinned)
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
              | sudo sh -s -- -b /usr/local/bin v0.71.0
            # Semgrep (via pipx)
            sudo apt-get update -y && sudo apt-get install -y pipx xz-utils
            pipx install semgrep
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
            # shellcheck (pinned) — static binary, no apt version pin available
            SHELLCHECK_VERSION="v0.10.0"
            curl -fsSL \
              "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
              -o /tmp/shellcheck.tar.xz
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
            sudo mv "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
            rm -rf /tmp/shellcheck.tar.xz "/tmp/shellcheck-${SHELLCHECK_VERSION}"
      - run:
          name: Tool versions
          command: |
            deno --version && node -v && npm -v && trivy --version && semgrep --version
            shellcheck --version
      - restore_cache:
          keys:
            - deno-deps-v1-{{ checksum "deno.json" }}-{{ checksum "deno.lock" }}
      - run:
          name: Warm Deno dependency cache (deno install, retries 3x with backoff)
          command: |
            # web-jam-tools#275: dedicated, retried step for the npm/jsr
            # fetch so a transient registry failure fails a step named for
            # what it does, instead of masquerading as "Test failed" inside
            # coverage:check. `deno install` (no args) resolves + caches
            # every dependency in deno.json/deno.lock into $DENO_DIR; on a
            # cache hit (restore_cache above) it does no network I/O at all.
            attempt=1
            until deno install; do
              if [ "$attempt" -ge 3 ]; then
                echo "FAIL: dependency warm-up failed after ${attempt} attempts" >&2
                exit 1
              fi
              backoff=$((attempt * 5))
              echo "Dependency fetch failed (attempt ${attempt}/3) — retrying in ${backoff}s..." >&2
              sleep "$backoff"
              attempt=$((attempt + 1))
            done
      - save_cache:
          key: deno-deps-v1-{{ checksum "deno.json" }}-{{ checksum "deno.lock" }}
          paths:
            - /home/circleci/.cache/deno
      - run:
          name: Shell gate (bash -n + shellcheck -S error over tracked *.sh)
          command: |
            # Approach A (Josh, web-jam-tools#133): error-severity only. This
            # catches real breakage (syntax errors, behavior-changing quoting)
            # in scripts/create-draft-pr.sh (the PR choke point for every
            # WebJamApps repo) and friends, WITHOUT chasing shellcheck's
            # warning/style findings across load-bearing scripts.
            mapfile -t SH_FILES < <(git ls-files '*.sh')
            if [ "${#SH_FILES[@]}" -eq 0 ]; then
              echo "No tracked *.sh files found — nothing to check."
              exit 0
            fi
            echo "Checking ${#SH_FILES[@]} tracked shell script(s):"
            printf '  %s\n' "${SH_FILES[@]}"
            echo
            echo "-- bash -n (syntax) --"
            for f in "${SH_FILES[@]}"; do
              bash -n "$f"
            done
            echo "OK: all scripts passed bash -n"
            echo
            echo "-- shellcheck -S error --"
            shellcheck -S error "${SH_FILES[@]}"
            echo "OK: shellcheck found no error-level findings"
      - run:
          name: Version bump check (PR branches only)
          command: |
            # web-jam-tools#133: replaces relying on the local pre-push hook
            # alone. Skipped on dev/main (nothing to diff against itself).
            # Falls back to the actual git branch when CIRCLE_BRANCH is unset
            # (e.g. `circleci local execute gate`) so local reproduction works.
            BRANCH="${CIRCLE_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
            if [ "$BRANCH" = "dev" ] || [ "$BRANCH" = "main" ]; then
              echo "On $BRANCH — version-bump check only applies to PR branches, skipping."
              exit 0
            fi
            git fetch --quiet origin dev
            MERGE_BASE="$(git merge-base HEAD origin/dev)"
            HEAD_VERSION="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('deno.json')).version)")"
            git show "${MERGE_BASE}:deno.json" > /tmp/base-deno.json
            BASE_VERSION="$(deno eval "console.log(JSON.parse(Deno.readTextFileSync('/tmp/base-deno.json')).version)")"
            echo "Branch: $BRANCH"
            echo "Merge-base with origin/dev: $MERGE_BASE"
            echo "Base version:  $BASE_VERSION"
            echo "HEAD version:  $HEAD_VERSION"
            if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
              echo 'FAIL: deno.json "version" is unchanged since the merge-base with origin/dev.' >&2
              echo "Bump the version in deno.json (once per PR, on the first commit) before merging." >&2
              exit 1
            fi
            echo "OK: version bumped from $BASE_VERSION to $HEAD_VERSION"
      - run:
          name: PR base branch verification (main requires dev head)
          command: |
            TARGET="${CIRCLE_TARGET_BRANCH:-${GITHUB_BASE_REF:-}}"
            SOURCE="${CIRCLE_BRANCH:-$(git rev-parse --abbrev-ref HEAD)}"
            if [ -n "$TARGET" ] && [ "$TARGET" = "main" ] && [ "$SOURCE" != "dev" ]; then
              echo "FAIL: PRs targeting main must originate from dev branch (got: $SOURCE)." >&2
              exit 1
            fi
            echo "OK: PR base/head branch verification passed (Target: ${TARGET:-default}, Source: $SOURCE)"
      - run:
          name: Type check
          command: deno task check
      - run:
          name: Lint
          command: deno task lint
      - run:
          name: Format check
          command: deno task fmt:check
      - run:
          name: Install hooks drift check (--check)
          command: |
            temp_hooks="$(mktemp -d)"
            temp_settings="$(mktemp -d)/settings.json"
            bash scripts/install-hooks.sh --hooks-dir "$temp_hooks" --settings-path "$temp_settings"
            bash scripts/install-hooks.sh --hooks-dir "$temp_hooks" --settings-path "$temp_settings" --check
      - run:
          name: Unit tests + coverage (>=90% all-files line, incl. skills/ validation)
          command: deno task coverage:check
      - run:
          name: Dependency + secret scan (Trivy)
          command: deno task audit
      - run:
          name: SAST (Semgrep)
          command: deno task sast

  # Deploy the daily-devotional Deno Deploy app (#69) ONLY from `main`.
  # Deploys are driven from CI, NOT Deno's GitHub integration (which builds every
  # branch/push — docs-only included — and posts a failing preview check on PRs;
  # its flaky builds also blocked a dev→main merge, #130). The app's GitHub
  # integration is disconnected in the console, so `main` is the only thing that
  # ever deploys and PRs get no Deno check. Auth via the DENO_DEPLOY_TOKEN
  # CircleCI env var. Runs only on `main`, only after `gate`.
  # NOTE: The webjam-outreach-cron deploy step was REMOVED (#153) — Josh deleted
  # that app 2026-07-08 to halt outreach sends. Do NOT re-add the step without
  # the #149 kill-switch redesign.
  deploy:
    executor: ci
    steps:
      - checkout
      - run:
          name: Install Deno
          command: |
            curl -fsSL https://deno.land/install.sh | sh -s v2.9.4
            echo 'export PATH="$HOME/.deno/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Deploy web-jam-devotional (production)
          command: |
            deno deploy \
              --org webjamapps \
              --app web-jam-devotional \
              --prod \
              --token "$DENO_DEPLOY_TOKEN"

  deploy-uptime:
    executor: ci
    steps:
      - checkout
      - run:
          name: Install Deno
          command: |
            curl -fsSL https://deno.land/install.sh | sh -s v2.9.4
            echo 'export PATH="$HOME/.deno/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Deploy web-jam-uptime (production)
          command: |
            deno deploy \
              --org webjamapps \
              --app web-jam-uptime \
              --prod \
              --token "$DENO_DEPLOY_TOKEN"

workflows:
  ci:
    jobs:
      - gate
      - deploy:
          requires:
            - gate
          filters:
            branches:
              only: main
      - deploy-uptime:
          requires:
            - gate
          filters:
            branches:
              only: main
