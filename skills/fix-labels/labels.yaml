# labels.yaml — web-jam-tools#263, pruned per web-jam-tools#300
#
# Single source of truth for the canonical GitHub label schema enforced by
# /fix-labels across the 8 active WebJamApps repos. Parsed by
# src/fix-labels/diff.ts (@std/yaml) — that script computes drift by
# comparing this file against each repo's actual `gh label list` output. No
# name/hex pair is restated in skills/fix-labels/SKILL.md; this file is it.
#
# Hand-edit this file when canon changes (new label, recolor, rescope, a new
# `keep:` veto). Every top-level shape below is asserted by
# test/fix_labels_diff.test.ts.
#
# web-jam-tools#300 pruned priority labels (-> native `Priority` issue
# field), topic labels (-> per-repo milestones, see `milestoneTopics:`
# below), and `bug`/`enhancement` (-> native issue Types). Deleting the
# now-orphaned labels from GitHub itself is a separate, deliberate step —
# web-jam-tools#299 — not done here.
#
# web-jam-tools#725 "Stop using the Blocked label where it is redundant and
# causes upkeep for no reason" established native GitHub dependencies
# (`blocked_by`) as the single source of truth for issue-to-issue blockers.
# Issues blocked by another GitHub issue use native dependencies only and do
# NOT carry the `Blocked` label (which would cause redundant metadata drift
# once the upstream issue closes). The `Blocked` label is canonical and
# reserved exclusively for issues blocked by non-GitHub prerequisites (assets
# from Josh, vendor delays, credentials, physical actions). See also
# historical references web-jam-tools#300 and web-jam-tools#329.

# Named repo groups, referenced by the `repos:` field on each label below.
# `all` is not listed here — it is computed in code as frontend + other.
repoClasses:
  frontend:
    - JaMmusic
    - CollegeLutheran
    - AppersonAuto
    - TimShermanMusic
    - HenricksonForSalem
  other:
    - web-jam-back
    - WebJamSocketCluster
    - web-jam-tools
  # The 4 booking-epic repos that carry `gig-outreach` (web-jam-tools#263,
  # "gig-outreach — 4 booking-epic repos ONLY"). NOT the same set as `other`.
  gigOutreach:
    - JaMmusic
    - web-jam-back
    - WebJamSocketCluster
    - web-jam-tools

labels:
  # --- Model-tier — all 8 repos ---
  # `modelTier: true` is the machine-readable marker for "this is a model
  # label" (web-jam-tools#265). src/fix-labels/generate-model-labels.ts
  # selects these six entries into the committed sidecar
  # skills/fix-labels/model-labels.json (`deno task
  # fix-labels:generate-model-labels`, kept honest by
  # test/fix_labels_model_labels_parity.test.ts), which
  # hooks/require-model-label-on-issue-create.sh reads at runtime — that hook
  # is bash/python and the CircleCI image has no PyYAML, so it can't parse
  # this file directly. No second hardcoded copy of the six names exists
  # anywhere; regenerate the sidecar after editing modelTier entries here.
  - name: Haiku
    hex: "0E8A16"
    description: "Mechanical tasks: lookups, scans, single-file edits, typo/data fixes, and running test/build checks"
    repos: all
    modelTier: true
  - name: Sonnet
    hex: "1D76DB"
    description: "Coding that needs a Claude-side capability Flash High lacks; no longer the default coder tier, which now ranks below Flash High"
    repos: all
    modelTier: true
  - name: Opus
    hex: "B392F0"
    description: "Top-tier architectural design, complex tech-lead judgment, spec/requirements alignment, and reviewing complex subagent outputs"
    repos: all
    modelTier: true
  - name: Fable
    hex: "D93F0B"
    description: "Fable 5 remains the superior model for deep reasoning, structural planning, and long-context retention - currently unavailable"
    repos: all
    modelTier: true
    # Retired/dormant, kept in every repo in case the model returns.
    # DELETE-PROTECTION ONLY (Josh, 2026-07-25): missing -> still propose
    # create; wrong color -> still propose recolor. It is just never a
    # delete/wrong-repo-removal candidate, in any repo.
    # web-jam-tools#300: flagged ambiguous (not one of the four prune
    # categories, not named in the issue's explicit "Keep" list either) —
    # Josh's call: LEAVE AS-IS, no schema change. He separately migrated all
    # 24 open `Fable`-labelled issues to `Opus` live on GitHub (0 open
    # issues carry `Fable` now); that was live metadata work, not a canon
    # change, so this entry (and its neverDelete protection) is unchanged.
    neverDelete: true

  # --- Model-tier — Flash High/Med all 8 repos ---
  # Josh's call (2026-07-31): Flash High is at Sonnet quality, and Flash
  # Medium is a viable substitute for Haiku, so both must be routable in
  # every repo, not just the 5 front-end ones — he wants routing
  # flexibility. This widened `Flash High` and `Flash Med` from
  # `repos: frontend` to `repos: all` (web-jam-tools, no issue — Flash High
  # had been wrongly proposed for REMOVE in web-jam-back and
  # WebJamSocketCluster, where web-jam-back#991 "Remove PUT /venue/:id once
  # all callers use PATCH" already carries it live).
  # Josh retired Flash Low on 2026-08-02.
  - name: Flash Med
    hex: "FBCA04"
    description: "Mechanical work, documentation cleanup, single-file edits, and routine execution tasks across all repos"
    repos: all
    modelTier: true
  - name: Flash High
    hex: "E67E22"
    description: "Default implementation tier: full-stack coding, multi-file refactoring, complex backend/system work, and interactive work across all repos; ranks above Sonnet"
    repos: all
    modelTier: true

  # --- Status — all 8 repos ---
  # `parked` and `Josh` are NOT priority/topic/type/dependency labels, so
  # they are outside every web-jam-tools#300 prune category and are kept.
  - name: parked
    hex: "C2C2C2"
    description: "Parked issue — work on hold until unparked"
    repos: all
  - name: Josh
    hex: "795548"
    description: "Manual step requiring Josh (credential creation, vendor dashboard action, or physical step)"
    repos: all
    # Marks an issue whose work only Josh can do — a manual step no agent can
    # perform (generating a credential, clicking through a vendor console, a
    # purchase, a physical action). Its purpose is to make his manual to-dos
    # findable in GitHub instead of being lost as a footnote in a chat session.
  - name: Blocked
    hex: "B60205"
    description: "Issue unworkable due to an external blocker (credential, vendor, asset, or non-GitHub prerequisite)"
    repos: all
    # Canonical label reserved exclusively for external / non-GitHub blockers
    # (web-jam-tools#725 "Stop using the Blocked label where it is redundant
    # and causes upkeep for no reason").
    #
    # STANDING RULE: Native GitHub dependencies (`blocked_by`) are the single
    # source of truth for issue-to-issue blockers — do NOT apply this label
    # to issues whose blocker is another GitHub issue, because native dependencies
    # clear automatically when the blocker closes. Apply this label ONLY when
    # work is unworkable due to an external prerequisite (vendor delays,
    # assets from Josh, credentials, physical actions) that cannot be linked
    # to a GitHub issue.
    #
    # `repos: all` — any repo can carry an externally blocked issue.
  - name: Needs Design
    hex: "D93F0B"
    description: "Epic or sub-issue requiring design clarification before implementation"
    repos: all
    # Marks an Epic or sub-issue requiring design clarification before implementation (web-jam-tools#415).

# --- Canonical topic milestones (web-jam-tools#300) ---
#
# Topic labels (formerly `gig-outreach` above, plus the `backup-restore`
# `keep:` entry) are replaced by per-repo MILESTONES, not a native issue
# field — see the design amendment on web-jam-tools#287 "fix-labels skill
# expanded / corrected" (2026-07-29): no custom field renders when unset, so
# none is writable by Josh by hand; milestones are the only surface that is
# both always-visible-when-unset and writable in the GitHub UI.
#
# Cross-repo topic matching is by EXACT milestone name — a typo or a missing
# milestone silently splits or hides a topic. src/fix-labels/milestone-diff.ts
# (`deno task fix-labels:milestone-diff`) diffs each listed repo's actual
# milestones against this list, per repo: missing / misspelled (typo or
# case-variant, proposed as a rename) / non-canonical (not on this list at
# all, or a canonical name present in a repo not listed below).
milestoneTopics:
  - name: gig-outreach
    repos:
      - JaMmusic
      - web-jam-back
      - web-jam-tools
      - WebJamSocketCluster
  - name: backup-restore
    repos:
      - web-jam-tools
  # web-jam-tools#300 follow-up: Josh's call — `timshermanmusic` IS a
  # canonical topic, not an unrelated keeper. Milestone already created live
  # in all three repos below, with the 5 historical (closed) issues assigned
  # (web-jam-back#922, web-jam-back#897, JaMmusic#1182,
  # WebJamSocketCluster#237, WebJamSocketCluster#94). This repo list must
  # match those three repos exactly, or the milestone-drift check reports
  # false drift. 0 open issues carry it as of this writing — mainly for
  # future use.
  - name: timshermanmusic
    repos:
      - web-jam-back
      - JaMmusic
      - WebJamSocketCluster
  # web-jam-tools#315 "Restrict Claude and Flash Dropbox access to
  # web-jam-llms and JoshMariaMusic only" — Josh's call, created live in all 8
  # active repos on 2026-07-30. Covers restricting what AI agents and
  # integrations can reach: Dropbox, filesystem, connectors, credentials.
  #
  # NOTE: this and `AI Misbehaves` below are the canonical milestones
  # using Title Case with a space; the three above are lowercase-kebab topic
  # names. Matching is by EXACT name, so the live milestones and this entry
  # agree — but if the convention is ever normalised, rename the live
  # milestones and this entry together.
  - name: Access Controls
    repos:
      - JaMmusic
      - CollegeLutheran
      - AppersonAuto
      - TimShermanMusic
      - HenricksonForSalem
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  # Josh's call, created live in web-jam-tools on 2026-07-31 (milestone #5).
  # Collects issues about an AI agent breaking one of Josh's operational
  # rules, and the guards that stop it happening again — the existing
  # examples being web-jam-tools#308 "Remote branches can be deleted by an
  # agent with no authorization — advisory guard does not block (3 layers:
  # deny rules, GitHub ruleset, HARD RULES)" and web-jam-tools#324 "No agent
  # connects a new account, credential, or MCP server without Josh's explicit
  # authorization — add the rule and audit where it can be mechanically
  # enforced". web-jam-tools only for now — add repos here (and create the
  # milestone live there) if the topic ever spans more.
  - name: AI Misbehaves
    repos:
      - web-jam-tools

  # Seven topics from Josh's list on web-jam-tools#287 "fix-labels skill
  # expanded / corrected" — never created at the time that issue landed, and
  # created live (as milestones, in exactly these four repos each) on
  # 2026-07-31 at his instruction. Registered here the same day so
  # `fix-labels:milestone-diff` stops reporting them as non-canonical drift.
  - name: song-recordings
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: set-lists
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: promote-gigs
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: venue-mining
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: financial
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: health-wellness
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools
  - name: politics
    repos:
      - JaMmusic
      - web-jam-back
      - WebJamSocketCluster
      - web-jam-tools

# DECISION (Josh, 2026-07-31): NEITHER a `Blocker` label NOR a `depends-on`
# label will be added, both requested on web-jam-tools#287 "fix-labels
# skill expanded / corrected". Reason: native GitHub issue dependencies
# already cover the blocking relationship (verified working cross-repo), and
# for the merge-at-the-same-time case Josh chose not to add a label at all.
# This comment exists so no future agent re-proposes either label as
# missing — treat both as considered and declined, not overlooked.

# Per-repo list of non-canonical label names that are explicitly preserved
# and must NEVER be proposed for delete, even though they're not on the
# `labels:` master list above.
#
# web-jam-tools#300: `backup-restore` (web-jam-tools) and `timshermanmusic`
# (web-jam-back) were both removed from this list — they are topic labels
