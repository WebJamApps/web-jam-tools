# labels.yaml — web-jam-tools#263, pruned per web-jam-tools#300
#
# Single source of truth for the canonical GitHub label schema enforced by
# /fix-labels across the 8 active WebJamApps repos. Parsed by
# src/fix-labels/diff.ts (@std/yaml) — that script computes drift by
# comparing this file against each repo's actual `gh label list` output. No
# name/hex pair is restated in skills/fix-labels/SKILL.md; this file is it.
#
# Hand-edit this file when canon changes (new label, recolor, rescope, a new
# `keep:` veto). Every top-level shape below is asserted by
# test/fix_labels_diff.test.ts.
#
# web-jam-tools#300 pruned priority labels (-> native `Priority` issue
# field), topic labels (-> per-repo milestones, see `milestoneTopics:`
# below), `bug`/`enhancement` (-> native issue Types), and `blocked` (->
# native issue dependencies). Deleting the now-orphaned labels from GitHub
# itself is a separate, deliberate step — web-jam-tools#299 — not done here.

# Named repo groups, referenced by the `repos:` field on each label below.
# `all` is not listed here — it is computed in code as frontend + other.
repoClasses:
  frontend:
    - JaMmusic
    - CollegeLutheran
    - AppersonAuto
    - TimShermanMusic
    - HenricksonForSalem
  other:
    - web-jam-back
    - WebJamSocketCluster
    - web-jam-tools
  # The 4 booking-epic repos that carry `gig-outreach` (web-jam-tools#263,
  # "gig-outreach — 4 booking-epic repos ONLY"). NOT the same set as `other`.
  gigOutreach:
    - JaMmusic
    - web-jam-back
    - WebJamSocketCluster
    - web-jam-tools

labels:
  # --- Model-tier — all 8 repos ---
  # `modelTier: true` is the machine-readable marker for "this is a model
  # label" (web-jam-tools#265). src/fix-labels/generate-model-labels.ts
  # selects these six entries into the committed sidecar
  # skills/fix-labels/model-labels.json (`deno task
  # fix-labels:generate-model-labels`, kept honest by
  # test/fix_labels_model_labels_parity.test.ts), which
  # hooks/require-model-label-on-issue-create.sh reads at runtime — that hook
  # is bash/python and the CircleCI image has no PyYAML, so it can't parse
  # this file directly. No second hardcoded copy of the six names exists
  # anywhere; regenerate the sidecar after editing modelTier entries here.
  - name: Haiku
    hex: "0E8A16"
    repos: all
    modelTier: true
  - name: Sonnet
    hex: "1D76DB"
    repos: all
    modelTier: true
  - name: Opus
    hex: "B392F0"
    repos: all
    modelTier: true
  - name: Fable
    hex: "D93F0B"
    repos: all
    modelTier: true
    # Retired/dormant, kept in every repo in case the model returns.
    # DELETE-PROTECTION ONLY (Josh, 2026-07-25): missing -> still propose
    # create; wrong color -> still propose recolor. It is just never a
    # delete/wrong-repo-removal candidate, in any repo.
    # web-jam-tools#300: flagged ambiguous (not one of the four prune
    # categories, not named in the issue's explicit "Keep" list either) —
    # Josh's call: LEAVE AS-IS, no schema change. He separately migrated all
    # 24 open `Fable`-labelled issues to `Opus` live on GitHub (0 open
    # issues carry `Fable` now); that was live metadata work, not a canon
    # change, so this entry (and its neverDelete protection) is unchanged.
    neverDelete: true

  # --- Model-tier — front-end 5 repos ONLY ---
  - name: Flash Med
    hex: "FBCA04"
    repos: frontend
    modelTier: true
  - name: Flash High
    hex: "E67E22"
    repos: frontend
    modelTier: true
  - name: Flash Low
    hex: "FEF2C0"
    repos: frontend
    modelTier: true

  # --- Status — all 8 repos ---
  # `parked` and `Josh` are NOT priority/topic/type/dependency labels, so
  # they are outside every web-jam-tools#300 prune category and are kept.
  - name: parked
    hex: "C2C2C2"
    repos: all
  - name: Josh
    hex: "795548"
    repos: all
    # Marks an issue whose work only Josh can do — a manual step no agent can
    # perform (generating a credential, clicking through a vendor console, a
    # purchase, a physical action). Its purpose is to make his manual to-dos
    # findable in GitHub instead of being lost as a footnote in a chat session.

# --- Canonical topic milestones (web-jam-tools#300) ---
#
# Topic labels (formerly `gig-outreach` above, plus the `backup-restore`
# `keep:` entry) are replaced by per-repo MILESTONES, not a native issue
# field — see the design amendment on web-jam-tools#287 "fix-labels skill
# expanded / corrected" (2026-07-29): no custom field renders when unset, so
# none is writable by Josh by hand; milestones are the only surface that is
# both always-visible-when-unset and writable in the GitHub UI.
#
# Cross-repo topic matching is by EXACT milestone name — a typo or a missing
# milestone silently splits or hides a topic. src/fix-labels/milestone-diff.ts
# (`deno task fix-labels:milestone-diff`) diffs each listed repo's actual
# milestones against this list, per repo: missing / misspelled (typo or
# case-variant, proposed as a rename) / non-canonical (not on this list at
# all, or a canonical name present in a repo not listed below).
milestoneTopics:
  - name: gig-outreach
    repos:
      - JaMmusic
      - web-jam-back
      - web-jam-tools
  - name: backup-restore
    repos:
      - web-jam-tools
  # web-jam-tools#300 follow-up: Josh's call — `timshermanmusic` IS a
  # canonical topic, not an unrelated keeper. Milestone already created live
  # in all three repos below, with the 5 historical (closed) issues assigned
  # (web-jam-back#922, web-jam-back#897, JaMmusic#1182,
  # WebJamSocketCluster#237, WebJamSocketCluster#94). This repo list must
  # match those three repos exactly, or the milestone-drift check reports
  # false drift. 0 open issues carry it as of this writing — mainly for
  # future use.
  - name: timshermanmusic
    repos:
      - web-jam-back
      - JaMmusic
      - WebJamSocketCluster

# Per-repo list of non-canonical label names that are explicitly preserved
# and must NEVER be proposed for delete, even though they're not on the
# `labels:` master list above.
#
# web-jam-tools#300: `backup-restore` (web-jam-tools) and `timshermanmusic`
# (web-jam-back) were both removed from this list — they are topic labels
# with working milestone replacements now (see `milestoneTopics:` above), so
# neither is a delete-protected keeper anymore; both will surface as
# ordinary non-canonical delete candidates for web-jam-tools#299 "Delete
# replaced labels org-wide, after migration". Empty for now — restore this
# comment's shape (`<repo>: [<label>]`) the next time Josh vetoes a new one.
keep: {}
